name: Sync Template Branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-template.yml'
      - 'src/components/ui/**'
      - 'src/components/blocks/**'
      - 'src/components/layouts/**'
      - 'src/components/patterns/**'
      - 'src/pages/templates/LoginPage.tsx'
      - 'src/pages/templates/SignupPage.tsx'
      - 'src/pages/templates/PasswordResetPage.tsx'
      - 'src/pages/templates/NotFoundPage.tsx'
      - 'src/pages/templates/ServerErrorPage.tsx'
      - 'src/pages/templates/MaintenancePage.tsx'
      - 'src/pages/templates/LandingPage.tsx'
      - 'src/pages/templates/DashboardHomePage.tsx'
      - 'src/pages/StarterPage.tsx'
      - 'src/pages/templates/README.md'
      - 'src/pages/templates/index.ts'
      - 'src/lib/**'
      - 'src/hooks/**'
      - 'src/app/**'
      - 'src/main.tsx'
      - 'src/vite-env.d.ts'
      - 'src/index.css'
      - 'src/styles/**'
      - 'src/assets/**'
      - 'src/components/theme-toggle.tsx'
      - 'src/components/logo.tsx'
      - 'src/components/tray-card.tsx'
      - 'documentation/**'
      - '.cursor/README.md'
      - 'TEMPLATE_README.md'
      - 'package.json'
      - 'components.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - 'index.html'
      - '.gitignore'
      - '.cursorrules'
  
  workflow_dispatch:

jobs:
  sync-template:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Sync to template branch
        run: |
          # Fetch all branches
          git fetch origin
          
          # Checkout or create template branch
          git checkout template 2>/dev/null || git checkout -b template origin/template
          
          # Remove all tracked files to start fresh
          git rm -rf . 2>/dev/null || true
          
          # === CORE CONFIG FILES ===
          git checkout origin/main -- \
            package.json \
            components.json \
            tsconfig.json \
            tsconfig.app.json \
            tsconfig.node.json \
            vite.config.ts \
            eslint.config.js \
            index.html \
            .gitignore \
            .cursorrules
          
          # === DOCUMENTATION ===
          git checkout origin/main -- documentation/ 2>/dev/null || true
          git checkout origin/main -- TEMPLATE_README.md 2>/dev/null || true

          # === CURSOR REFERENCE ===
          mkdir -p .cursor
          git checkout origin/main -- .cursor/README.md 2>/dev/null || true
          
          # === SOURCE CODE ===
          git checkout origin/main -- src/components/ui/
          git checkout origin/main -- src/components/blocks/
          git checkout origin/main -- src/components/layouts/
          git checkout origin/main -- src/components/patterns/
          git checkout origin/main -- src/components/theme-toggle.tsx 2>/dev/null || true
          git checkout origin/main -- src/components/logo.tsx 2>/dev/null || true
          git checkout origin/main -- src/components/tray-card.tsx 2>/dev/null || true
          git checkout origin/main -- src/lib/
          git checkout origin/main -- src/hooks/
          git checkout origin/main -- src/app/
          git checkout origin/main -- src/main.tsx
          git checkout origin/main -- src/vite-env.d.ts
          git checkout origin/main -- src/index.css
          git checkout origin/main -- src/styles/
          git checkout origin/main -- src/assets/
          
          # === ESSENTIAL PAGES ONLY ===
          mkdir -p src/pages/templates
          # Auth pages
          git checkout origin/main -- src/pages/templates/LoginPage.tsx 2>/dev/null || true
          git checkout origin/main -- src/pages/templates/SignupPage.tsx 2>/dev/null || true
          git checkout origin/main -- src/pages/templates/PasswordResetPage.tsx 2>/dev/null || true
          # Error & Status pages
          git checkout origin/main -- src/pages/templates/NotFoundPage.tsx 2>/dev/null || true
          git checkout origin/main -- src/pages/templates/ServerErrorPage.tsx 2>/dev/null || true
          git checkout origin/main -- src/pages/templates/MaintenancePage.tsx 2>/dev/null || true
          # Landing & Home pages
          git checkout origin/main -- src/pages/templates/LandingPage.tsx 2>/dev/null || true
          git checkout origin/main -- src/pages/templates/DashboardHomePage.tsx 2>/dev/null || true
          # Starter & README
          git checkout origin/main -- src/pages/templates/README.md 2>/dev/null || true
          git checkout origin/main -- src/pages/StarterPage.tsx
          
          # === CREATE TEMPLATE-SPECIFIC FILES ===
          cat > src/pages/templates/index.ts << 'EOF'
          // Authentication Pages
          export { LoginPage } from "./LoginPage"
          export { SignupPage } from "./SignupPage"
          export { PasswordResetPage } from "./PasswordResetPage"
          
          // Error & Status Pages
          export { NotFoundPage } from "./NotFoundPage"
          export { ServerErrorPage } from "./ServerErrorPage"
          export { MaintenancePage } from "./MaintenancePage"
          
          // Landing & Home Pages
          export { LandingPage } from "./LandingPage"
          export { DashboardHomePage } from "./DashboardHomePage"
          EOF
          
          cat > src/app/router.tsx << 'EOF'
          import { createBrowserRouter } from "react-router-dom"
          import { AppShell } from "@/components/layouts/app-shell"
          import { StarterPage } from "@/pages/StarterPage"
          import { 
            LoginPage, 
            SignupPage, 
            PasswordResetPage, 
            NotFoundPage,
            LandingPage,
            DashboardHomePage,
          } from "@/pages/templates"
          import { RouteErrorBoundary } from "@/components/blocks/route-error-boundary"
          
          /**
           * Application Router Configuration
           * 
           * This is a starter router with common routes. Customize for your app.
           * 
           * Route Types:
           * 1. Public routes (no auth required): LandingPage, LoginPage, etc.
           * 2. Protected routes (inside AppShell): Dashboard, Settings, etc.
           * 3. Error routes: 404, 500, etc.
           */
          export const router = createBrowserRouter([
            // Public landing page (optional - remove if app is login-only)
            {
              path: "/welcome",
              element: <LandingPage />,
              errorElement: <RouteErrorBoundary />,
            },
            
            // Protected routes (wrapped in AppShell with sidebar)
            {
              element: <AppShell />,
              errorElement: <RouteErrorBoundary />,
              children: [
                // Replace StarterPage with DashboardHomePage after implementing auth
                { path: "/", element: <StarterPage /> },
                // Example: Role-based dashboard home
                // { path: "/dashboard", element: <DashboardHomePage user={currentUser} /> },
              ],
            },
            
            // Authentication routes (standalone, no AppShell)
            {
              path: "/login",
              element: <LoginPage />,
              errorElement: <RouteErrorBoundary />,
            },
            {
              path: "/signup",
              element: <SignupPage />,
              errorElement: <RouteErrorBoundary />,
            },
            {
              path: "/password-reset",
              element: <PasswordResetPage />,
              errorElement: <RouteErrorBoundary />,
            },
            
            // 404 catch-all
            {
              path: "*",
              element: <NotFoundPage homeButton={{ href: "/", label: "Go Home" }} />,
              errorElement: <RouteErrorBoundary />,
            },
          ])
          EOF
          
          if [ -f "TEMPLATE_README.md" ]; then
            mv TEMPLATE_README.md README.md
          fi
          
          # === COMMIT AND PUSH ===
          git add -A
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync"
          else
            git commit -m "Sync from main branch [skip ci]"
            git push origin template
            echo "✅ Template branch synced successfully!"
          fi

      - name: Summary
        run: |
          echo "## ✅ Template Branch Synced" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Included Files:" >> $GITHUB_STEP_SUMMARY
          echo "- All UI/blocks/layouts/patterns components" >> $GITHUB_STEP_SUMMARY
          echo "- **Auth pages**: Login, Signup, PasswordReset" >> $GITHUB_STEP_SUMMARY
          echo "- **Error pages**: NotFound (404), ServerError (500), Maintenance" >> $GITHUB_STEP_SUMMARY
          echo "- **Home pages**: LandingPage (public), DashboardHomePage (role-based), StarterPage" >> $GITHUB_STEP_SUMMARY
          echo "- Lib, hooks, styles, assets" >> $GITHUB_STEP_SUMMARY
          echo "- **Documentation**: Complete guides including architecture, navigation, components (documentation/)" >> $GITHUB_STEP_SUMMARY
          echo "- **AI Agent Reference**: Quick links to documentation (.cursor/README.md)" >> $GITHUB_STEP_SUMMARY
          echo "- Config files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Excluded:" >> $GITHUB_STEP_SUMMARY
          echo "- Demo pages (ComponentsPage, ChartsPage, FormsPage, CardsPage, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- HomePage (main branch only)" >> $GITHUB_STEP_SUMMARY
          echo "- Registry and build files" >> $GITHUB_STEP_SUMMARY